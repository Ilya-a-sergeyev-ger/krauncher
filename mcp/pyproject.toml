[project]
name = "krauncher-mcp"
version = "0.1.1"
description = "MCP server: a pre-run GPU-task cost estimate (compute/setup/io on the reference card, VRAM/disk, what the analyzer read) as an agent tool. Static analysis only — the code is never executed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ilya Sergeev", email = "package@krauncher.com" }]
keywords = ["mcp", "gpu", "cost-estimate", "krauncher", "llm-agent"]
dependencies = [
    "mcp>=2.0",
    # The analyzer client — 0.2.9 first exposed min_disk_gb as a top-level field.
    "krauncher>=0.2.9",
]

[project.scripts]
krauncher-mcp = "krauncher_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krauncher_mcp"]
