[project]
name = "krauncher-mcp"
version = "0.5.0"
description = "MCP server: a pre-run GPU-task cost estimate (compute/setup/io on the reference card, VRAM/disk, what the analyzer read) as an agent tool. Static analysis only — the code is never executed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ilya Sergeev", email = "package@krauncher.com" }]
keywords = ["mcp", "gpu", "cost-estimate", "krauncher", "llm-agent"]
dependencies = [
    "mcp>=2.0",
    # The analyzer client — 0.2.10 first let this server reach the analyzer
    # directly: AnalyzerClient(source=, surface=) and KrauncherClient.analyzer().
    "krauncher>=0.2.10",
]

[project.scripts]
krauncher-mcp = "krauncher_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krauncher_mcp"]
