[project]
name = "krauncher"
version = "0.2.8"
description = "Run Python functions and notebook cells on the cheapest suitable remote GPU — per-task billing, no instances"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ilya Sergeev", email = "package@krauncher.com" }]
keywords = ["gpu", "cloud", "machine-learning", "remote-execution", "task", "jupyter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.26.0",
    "websockets>=12.0",
    "cryptography>=42.0",
    "grpcio>=1.80",
    "protobuf>=4.25",
]

[project.urls]
Homepage = "https://krauncher.com"
Repository = "https://github.com/Ilya-a-sergeyev-ger/krauncher"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krauncher"]

[tool.hatch.build.targets.sdist]
# Public artifact: the library only — no calibration material, test
# harness shell scripts or tutorials from the working repo.
include = [
    "krauncher",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
